<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDP - admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Header the website, implemented the logo, navigation bar and login button-->
    <header class="navbar">
        <a href="0_homepage.html" class="brand">
            <img src="logo.jpeg" alt="PDP" class="brand-logo">
            <div class="brand-text">
                <h1>PDP</h1>
                <p>Pigeon Delivery Parcel</p>
            </div>
        </a>
        <!--navigation bar with links to different pages, the active page is highlighted-->
        <nav class="nav-links">
            <a href="0_homepage.html">Home</a>
            <a href="2_client.html">Client</a>
            <a href="3_courier.html">Courier</a>
            <a href="5_staff.html">Staff</a>
            <a href="4_admin.html" class="active">Admin</a>
            <a href="6_team.html">Team</a>
            <a href="#">Customer service</a>
        </nav>
        
        <a href="1_login.html" class="btn-login">Login</a>
    </header>
    
    <!-- Header for the controlroom -->
    <section class="team-banner">
        <div class="banner-content">
            <p class="team-label">ADMIN</p>
            <h2 class="team-heading">Control Room</h2>
        </div>
    </section>
  
    <main class="dashboard">
      <!-- 1. Dynamik KPI -->
      <section class="stats-grid" id="stats-container">
      </section>
  
      <!-- Diagram -->
      <section class="card">
        <h2>DELIVERIES THIS WEEK</h2>
        <div class="bar-chart" id="chart-container">
        </div>
      </section>
  
      <!-- Userlist -->
      <section class="card">
        <h2>USERS</h2>
        <ul class="user-list" id="users-container">
        </ul>
      </section>
      
      <!-- Pending staff approvals -->
    <section class="card" style="margin-top: 25px;">
      <h2>Pending Staff Approvals</h2>
      <div id="staff-approvals-container">
      </div>
  </section>
    </main>
    
  
    <script src="scripts.js" defer></script>
</body>
</html>
