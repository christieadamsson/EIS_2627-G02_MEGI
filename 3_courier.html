            <img src="pigeon_logo.png" alt="PDP logo" class="brand-logo">

                <p>Pigeon Delivery Parcel</p>

            </ul>
        </nav>
        <a href="1_login.html" class="btn-login">LOGIN</a>
    </header>

    <main>
        <!-- Page banner (reuses the team page banner classes) -->
        <section class="team-banner">
            <div class="banner-content">
                <p class="team-label">COURIER</p>
                <h2 class="team-heading">Today's Route</h2>
            </div>
        </section>

        <div class="courier-section">

            <!-- Route summary -->
            <section class="route-stats">
                <div class="stat-card">
                    <p>Stops today</p>
                    <h3 id="stat-total">3</h3>
                </div>
                <div class="stat-card">
                    <p>Delivered</p>
                    <h3 id="stat-delivered">1</h3>
                </div>
                <div class="stat-card">
                    <p>Remaining</p>
                    <h3 id="stat-remaining">2</h3>
                </div>
            </section>

            <!-- Route map -->
            <section class="route-map">
                <svg viewBox="0 0 700 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of today's route with three stops">
                    <defs>
                        <pattern id="grid" width="57" height="57" patternUnits="userSpaceOnUse">
                            <path d="M57 0 L0 0 0 57" fill="none" stroke="#c7e3f0" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="700" height="320" fill="url(#grid)"/>
                    <path class="route-line" d="M46 251 C 90 180, 140 168, 180 172 S 270 205, 320 196 S 420 55, 520 48 S 620 120, 640 183"/>
                    <circle class="map-stop done" data-stop="RR-1036" cx="46" cy="251" r="11"/>
                    <circle class="map-stop" data-stop="RR-1042" cx="320" cy="196" r="11"/>
                    <circle class="map-stop" data-stop="RR-1039" cx="640" cy="183" r="11"/>
                </svg>
                <span class="map-label map-label-depot">Depot</span>
                <span class="map-label map-label-dest">Destination</span>
            </section>

            <!-- Confirmation message, shown by courier.js -->
            <p id="courier-msg" class="courier-msg msg-success" role="status" hidden></p>

            <!-- Delivery stops, rendered by courier.js from the stops list -->
            <section class="stops-grid" id="stops-grid"></section>

        </div>
    </main>
