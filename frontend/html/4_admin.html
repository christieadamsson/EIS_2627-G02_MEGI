<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDP - admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!--Header the website, implemented the logo, navigation bar and login button-->
    <header class="navbar">
        <a href="0_homepage.html" class="brand">
            <img src="pigeon_logo.png" alt="PDP" class="brand-logo">
            <div class="brand-text">
                <h1>PDP</h1>
                <p>Pigeon Delivery Parcel</p>
            </div>
        </a>
        <!--navigation bar with links to different pages, the active page is highlighted-->
        <nav class="nav-links">
            <a href="0_homepage.html">Home</a>
            <a href="2_client.html">Client</a>
            <a href="3_courier.html">Courier</a>
            <a href="5_staff.html">Staff</a>
            <a href="4_admin.html" class="active">Admin</a>
            <a href="6_team.html">Team</a>
            <a href="7_customerservice.html">Customer service</a>
        </nav>
        
        <a href="1_login.html" class="btn-login">Login</a>
    </header>
    
    <!-- Header for the controlroom -->
    <section class="team-banner">
        <div class="banner-content">
            <p class="team-label">ADMIN</p>
            <h2 class="team-heading">Control Room</h2>
        </div>
    </section>
  
    <main class="dashboard">
      <!-- Operational KPIs, calculated from the live data (admin.js) -->
      <section class="card">
        <h2>OPERATIONAL KPIs</h2>
        <div class="kpi-groups" id="kpi-container">
        </div>
      </section>

      <!-- Deliveries per day, from the same orders as the KPIs (admin.js) -->
      <section class="card">
        <h2>DELIVERIES – LAST 7 DAYS</h2>
        <p class="chart-total" id="chart-total"></p>
        <div class="bar-chart" id="chart-container">
        </div>
      </section>
  
      <!-- Userlist -->
      <section class="card">
        <h2>USERS</h2>
        <ul class="user-list" id="users-container">
        </ul>
      </section>
      
      <!-- Add new staff members: added straight to the users list above (admin.js) -->
      <section class="card" style="margin-top: 25px;">
          <h2>Add New Staff Member</h2>
          <form id="add-staff-form" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
              <div style="flex: 1; min-width: 200px;">
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #172b4d;">Name</label>
                  <input type="text" id="new-staff-name" placeholder="Full name" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif;">
              </div>
              <div style="flex: 1; min-width: 200px;">
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #172b4d;">Role</label>
                  <input type="text" id="new-staff-role" placeholder="e.g. Fleet Assistant" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif;">
              </div>
              <button type="submit" class="badge badge-active" style="cursor: pointer; border: none; padding: 12px 24px; font-size: 14px;">Add Staff</button>
          </form>
      </section>
    </main>


    <script src="data.js" defer></script>
    <script src="scripts.js" defer></script>
    <script src="admin.js" defer></script>

<footer>
        <p>PDP - Pigeon Delivery Parcel | M.EGI017 Enterprise Information Systems - Group 2</p>
 </footer>   


</body>
</html>
